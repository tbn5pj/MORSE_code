name: Render manuscript PDF previews

on:
  push:
    branches: [main]
    paths:
      - 'assets/figure1_left_stats_2panel.pdf'
      - 'assets/pair_swap_current_figure.pdf'
      - '.github/workflows/render-figures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render exact paper figures
        run: |
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdftoppm -f 1 -l 1 -r 170 -singlefile -png \
            assets/figure1_left_stats_2panel.pdf \
            assets/ordering_sensitivity
          pdftoppm -f 1 -l 1 -r 170 -singlefile -png \
            assets/pair_swap_current_figure.pdf \
            assets/information_preemption_pair_swap
      - name: Commit directly rendered previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ordering_sensitivity.png assets/information_preemption_pair_swap.png
          if ! git diff --cached --quiet; then
            git commit -m "Render original paper figure previews"
            git push origin HEAD:main
          fi
